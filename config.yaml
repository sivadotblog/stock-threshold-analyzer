# ---------------------------------------------------------------------------
# Stock Threshold Analyzer — single source of truth
# ---------------------------------------------------------------------------

# Static site: pre-fetch price data for the top N tickers from bullish_screen.json.
# Run screen_bullish.py first, then generate_data.py.
site:
  lookback_years: 5
  top_n: 600

# Screener defaults used by screen_bullish.py.
# All can be overridden at the command line.
screen:
  threshold_pct: 10.0
  lookback_years: 5
  top: 25

