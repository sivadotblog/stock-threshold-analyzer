name: Add Ticker Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  add-ticker:
    # Only run for issues with the add-ticker label
    if: contains(toJSON(github.event.issue.labels), '"add-ticker"')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Parse ticker from issue title
        id: parse
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Extract everything after "Add ticker:" and strip whitespace
          TICKER=$(echo "$TITLE" | sed 's/.*[Aa]dd [Tt]icker:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ' \t\r\n')
          echo "ticker=$TICKER" >> "$GITHUB_OUTPUT"
          echo "Parsed ticker: $TICKER"

      - name: Validate and add ticker
        id: validate
        run: uv run python scripts/validate_ticker.py "${{ steps.parse.outputs.ticker }}"

      - name: Commit config.yaml
        if: steps.validate.outputs.added == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "feat(config): add ${{ steps.parse.outputs.ticker }} via issue #${{ github.event.issue.number }}"
          git push

      - name: Comment success
        if: steps.validate.outputs.added == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `✅ **${{ steps.parse.outputs.ticker }}** (${{ steps.validate.outputs.name }}) has been added to the screening universe!`,
                ``,
                `The leaderboard will update automatically within the next few minutes as the [data refresh workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/refresh_sma_data.yml) runs.`,
              ].join('\n')
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Comment failure
        if: steps.validate.outputs.added != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `❌ Could not add **${{ steps.parse.outputs.ticker }}**: ${{ steps.validate.outputs.reason }}`,
                ``,
                `Please check the ticker symbol and try again.`,
              ].join('\n')
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'not_planned',
            });
