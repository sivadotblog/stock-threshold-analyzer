[project]
name = "everest"
version = "0.1.0"
description = "Bullish oscillator screener for stocks"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "pandas-ta>=0.3.14",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
